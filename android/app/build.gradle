plugins {
    id 'com.android.application'
}

android {
    namespace 'com.versend.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.versend.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.register('syncWebDist', Copy) {
    def rootDist = file('../../dist')
    onlyIf { rootDist.exists() && new File(rootDist, 'index.html').exists() }
    from rootDist
    into 'src/main/assets/public'
}

preBuild.dependsOn('syncWebDist')

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
